<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Pipeline Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;
    --series-2:       #eb6834;
    --good:           #0ca30c;
    --critical:       #d03b3b;
    --warning:        #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --good:           #0ca30c;
      --critical:       #e66767;
      --warning:        #fab219;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --good:           #0ca30c;
    --critical:       #e66767;
    --warning:        #fab219;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1160px; margin: 0 auto; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); margin: 0 0 20px; }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    border-bottom: 1px solid var(--gridline);
    margin-bottom: 20px;
    padding-bottom: 0;
  }
  .tab-btn {
    appearance: none; border: none; background: transparent;
    color: var(--text-secondary); font: inherit; font-weight: 600; font-size: 13px;
    padding: 10px 14px; cursor: pointer; border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--text-primary); background: var(--surface-1); }
  .tab-btn.active { color: var(--series-1); border-bottom-color: var(--series-1); }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 20px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .value.good { color: var(--good); }
  .kpi .value.critical { color: var(--critical); }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--text-secondary); font-weight: 600; }
  .panel p.note { color: var(--text-muted); font-size: 12px; margin: 0 0 12px; }

  svg text { fill: var(--text-muted); font-size: 11px; }
  .chart-line { fill: none; stroke: var(--series-1); stroke-width: 2; }
  .chart-grid { stroke: var(--gridline); stroke-width: 1; }
  .chart-baseline { stroke: var(--baseline); stroke-width: 1; }
  .crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; display: none; }
  .hover-dot { fill: var(--series-1); display: none; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--text-primary); white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10;
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  td.wrap-cell { white-space: normal; max-width: 260px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .badge.good { color: var(--good); background: color-mix(in srgb, var(--good) 15%, transparent); }
  .badge.critical { color: var(--critical); background: color-mix(in srgb, var(--critical) 15%, transparent); }
  .badge.muted { color: var(--text-muted); background: color-mix(in srgb, var(--text-muted) 15%, transparent); }

  .empty { text-align: center; padding: 48px 16px; color: var(--text-secondary); }
  .empty code { background: var(--gridline); padding: 2px 6px; border-radius: 4px; font-size: 12px; }

  footer { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trading Pipeline Dashboard</h1>
  <p class="subtitle">Team C &rarr; Team B &rarr; Team A &rarr; Team S. Paper trading only.</p>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="main">Main</button>
    <button class="tab-btn" data-tab="teamc">Team C &middot; Data &amp; Signals</button>
    <button class="tab-btn" data-tab="teamb">Team B &middot; Quants</button>
    <button class="tab-btn" data-tab="teama">Team A &middot; Strategy &amp; Risk</button>
    <button class="tab-btn" data-tab="teams">Team S &middot; Execution</button>
  </div>

  <div id="content">
    <div class="empty">Loading run history&hellip;</div>
  </div>

  <footer id="footer"></footer>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const HISTORY_URL = './logs/history.json';
const REFRESH_MS = 60000;
const ROW_LIMIT = 150;

let historyData = [];
let activeTab = 'main';
let lastEquityPoints = [];

function fmtMoney(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function fmtNum(n, digits) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return Number(n).toFixed(digits === undefined ? 2 : digits);
}
function fmtPct(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  return (Number(n) * 100).toFixed(1) + '%';
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function statusBadge(text, kind) {
  return `<span class="badge ${kind}">${esc(text)}</span>`;
}
function recent(list) {
  return list.slice().reverse().slice(0, ROW_LIMIT);
}

function renderEmpty(message) {
  document.getElementById('content').innerHTML = `
    <div class="empty">
      <p>${esc(message)}</p>
      <p>Runs are written by <code>.github/workflows/trading-pipeline.yml</code> to
      <code>logs/history.json</code> — check back after the next scheduled run,
      or trigger it manually from the Actions tab.</p>
    </div>`;
}

// ---------------------------------------------------------------- Main tab

function buildEquitySeries(history) {
  return history
    .filter(r => r.account && typeof r.account.equity === 'number')
    .map(r => ({ t: r.run_at, equity: r.account.equity }));
}

function renderEquityChart(series) {
  if (series.length < 2) {
    return '<p class="note">Not enough account snapshots yet to draw an equity curve (need Alpaca credentials configured and at least two runs).</p>';
  }
  const W = 1000, H = 220, PAD = 32;
  const values = series.map(s => s.equity);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = (maxV - minV) || 1;
  const xStep = (W - PAD * 2) / (series.length - 1);
  const points = series.map((s, i) => {
    const x = PAD + i * xStep;
    const y = H - PAD - ((s.equity - minV) / range) * (H - PAD * 2);
    return { x, y, ...s };
  });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const gridY = [0, 0.25, 0.5, 0.75, 1].map(f => H - PAD - f * (H - PAD * 2));

  // Kept in a module-level variable (not a nested script element) so
  // this file's own outer script block never contains a literal
  // end-of-script tag, which would otherwise terminate it early and
  // dump the rest of the JS onto the page as plain text.
  lastEquityPoints = points.map(p => ({ x: p.x, y: p.y, t: p.t, equity: p.equity }));

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;" id="equity-svg">
      ${gridY.map(y => `<line class="chart-grid" x1="${PAD}" x2="${W - PAD}" y1="${y}" y2="${y}" />`).join('')}
      <line class="chart-baseline" x1="${PAD}" x2="${W - PAD}" y1="${H - PAD}" y2="${H - PAD}" />
      <path class="chart-line" d="${path}" />
      <line class="crosshair" id="crosshair" x1="0" x2="0" y1="${PAD}" y2="${H - PAD}" />
      <circle class="hover-dot" id="hover-dot" r="4" />
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hover-target" />
    </svg>
  `;
}

function wireEquityHover() {
  const svg = document.getElementById('equity-svg');
  if (!svg) return;
  const target = document.getElementById('hover-target');
  const crosshair = document.getElementById('crosshair');
  const dot = document.getElementById('hover-dot');
  const tooltip = document.getElementById('tooltip');
  const points = lastEquityPoints;
  if (!points.length) return;

  target.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const scaleX = 1000 / rect.width;
    const mouseX = (e.clientX - rect.left) * scaleX;
    let nearest = points[0];
    for (const p of points) {
      if (Math.abs(p.x - mouseX) < Math.abs(nearest.x - mouseX)) nearest = p;
    }
    crosshair.style.display = 'block';
    crosshair.setAttribute('x1', nearest.x);
    crosshair.setAttribute('x2', nearest.x);
    dot.style.display = 'block';
    dot.setAttribute('cx', nearest.x);
    dot.setAttribute('cy', nearest.y);

    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 12) + 'px';
    tooltip.innerHTML = `<strong>${fmtMoney(nearest.equity)}</strong><br>${fmtTime(nearest.t)}`;
  });
  target.addEventListener('mouseleave', () => {
    crosshair.style.display = 'none';
    dot.style.display = 'none';
    tooltip.style.display = 'none';
  });
}

function renderTradeLogRow(r) {
  const exec = r.execution_result;
  if (!exec || !exec.executed) return '';
  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${esc(exec.side)}</td>
      <td>${exec.total_qty ?? '—'}</td>
      <td>${fmtMoney(exec.reference_price)}</td>
      <td>${(exec.child_orders || []).length}</td>
      <td>${r.account ? fmtMoney(r.account.equity) : '—'}</td>
    </tr>`;
}

function renderMainRow(r) {
  const teamA = r.team_a_report || {};
  const exec = r.execution_result;
  const approvedBadge = teamA.approved
    ? statusBadge('approved', 'good')
    : statusBadge(teamA.veto_reason ? 'vetoed' : 'no trade', teamA.veto_reason ? 'critical' : 'muted');
  const execBadge = !exec
    ? statusBadge('dry run', 'muted')
    : (exec.executed ? statusBadge('executed', 'good') : statusBadge(exec.reason || 'skipped', 'muted'));

  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${esc(teamA.direction) || '—'}</td>
      <td>${approvedBadge}</td>
      <td>${fmtMoney(teamA.position_size_usd)}</td>
      <td>${execBadge}</td>
      <td>${r.account ? fmtMoney(r.account.equity) : '—'}</td>
    </tr>`;
}

function renderMainTab(history) {
  const latestWithAccount = history.slice().reverse().find(r => r.account);
  const executedRows = history.filter(r => r.execution_result?.executed);
  const approvedCount = history.filter(r => r.team_a_report?.approved).length;
  const symbolsScanned = new Set(history.map(r => r.symbol)).size;
  const equitySeries = buildEquitySeries(history);

  const tradeRows = recent(executedRows).map(renderTradeLogRow).join('');
  const mainRows = recent(history).map(renderMainRow).join('');

  return `
    <div class="kpis">
      <div class="kpi"><div class="label">Latest Equity</div><div class="value">${fmtMoney(latestWithAccount?.account?.equity)}</div></div>
      <div class="kpi"><div class="label">Total Scans</div><div class="value">${history.length}</div></div>
      <div class="kpi"><div class="label">Symbols Covered</div><div class="value">${symbolsScanned}</div></div>
      <div class="kpi"><div class="label">Approved Theses</div><div class="value">${approvedCount}</div></div>
      <div class="kpi"><div class="label">Trades Executed</div><div class="value">${executedRows.length}</div></div>
    </div>

    <div class="panel">
      <h2>Account Equity</h2>
      ${renderEquityChart(equitySeries)}
    </div>

    <div class="panel">
      <h2>Trade Log (buys &amp; sells actually submitted)</h2>
      ${tradeRows ? `
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Ref. Price</th><th>Child Orders</th><th>Equity After</th></tr></thead>
        <tbody>${tradeRows}</tbody>
      </table>` : '<p class="note">No trades executed yet.</p>'}
    </div>

    <div class="panel">
      <h2>All Scans (most recent first)</h2>
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Thesis</th><th>Team A</th><th>Size</th><th>Team S</th><th>Equity</th></tr></thead>
        <tbody>${mainRows}</tbody>
      </table>
    </div>
  `;
}

// -------------------------------------------------------------- Team C tab

function renderTeamCRow(r) {
  const c = r.team_c || {};
  const stats = c.statistics || {};
  const sent = c.sentiment || {};
  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${fmtMoney(c.last_close)}</td>
      <td>${fmtNum(stats.rsi_14, 1)}</td>
      <td>${fmtNum(stats.sma_20)}</td>
      <td>${fmtNum(stats.z_score_20)}</td>
      <td>${fmtNum(stats.atr_14)}</td>
      <td>${fmtNum(sent.mean_compound, 2)}</td>
      <td>${sent.reddit_post_count ?? 0} / ${sent.news_article_count ?? 0}</td>
      <td class="wrap-cell">${esc((sent.top_keywords || []).slice(0, 6).join(', '))}</td>
    </tr>`;
}

function renderTeamCTab(history) {
  const rows = recent(history).map(renderTeamCRow).join('');
  return `
    <div class="panel">
      <h2>Data Puller &amp; Statistician</h2>
      <p class="note">Moving averages, RSI, Bollinger/Z-score, ATR -- see knowledge_base/team_c_data_signals.md for formulas.</p>
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Close</th><th>RSI(14)</th><th>SMA(20)</th><th>Z-score</th><th>ATR(14)</th><th>Sentiment</th><th>Reddit/News</th><th>Top Keywords</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="10" class="note">No data yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// -------------------------------------------------------------- Team B tab

function renderTeamBRow(r) {
  const b = r.team_b || {};
  const math = b.mathematician || {};
  const ou = math.ornstein_uhlenbeck || {};
  const ml = b.ml_engineer || {};
  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${esc(math.market_regime) || '—'}</td>
      <td>${fmtPct(math.annualized_drift)}</td>
      <td>${fmtPct(math.annualized_volatility)}</td>
      <td>${fmtNum(ou.theta, 3)}</td>
      <td>${fmtMoney(ou.mu)}</td>
      <td>${fmtPct(ml.probability_up_next_day)}</td>
    </tr>`;
}

function renderTeamBTab(history) {
  const rows = recent(history).map(renderTeamBRow).join('');
  return `
    <div class="panel">
      <h2>Mathematician &amp; ML Engineer</h2>
      <p class="note">GBM/Ornstein-Uhlenbeck/regime detection + Random Forest walk-forward probability -- see knowledge_base/team_b_quants.md.</p>
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Regime</th><th>Ann. Drift</th><th>Ann. Vol</th><th>OU theta</th><th>OU mu</th><th>P(up next day)</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="note">No data yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// -------------------------------------------------------------- Team A tab

function renderTeamARow(r) {
  const a = r.team_a_report || {};
  const approvedBadge = a.approved
    ? statusBadge('approved', 'good')
    : statusBadge(a.veto_reason ? 'vetoed' : 'no trade', a.veto_reason ? 'critical' : 'muted');
  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${esc(a.direction) || '—'}</td>
      <td>${fmtPct(a.confidence)}</td>
      <td>${approvedBadge}</td>
      <td class="wrap-cell">${esc(a.veto_reason) || '—'}</td>
      <td>${fmtPct(a.kelly_fraction)}</td>
      <td>${fmtPct(a.var_95)}</td>
      <td>${fmtPct(a.cvar_95)}</td>
      <td>${fmtMoney(a.position_size_usd)}</td>
    </tr>`;
}

function renderTeamATab(history) {
  const rows = recent(history).map(renderTeamARow).join('');
  return `
    <div class="panel">
      <h2>Trader &amp; Risker</h2>
      <p class="note">Kelly Criterion sizing, VaR/CVaR veto -- see knowledge_base/team_a_strategy_risk.md.</p>
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Thesis</th><th>Confidence</th><th>Status</th><th>Veto Reason</th><th>Kelly</th><th>VaR(95)</th><th>CVaR(95)</th><th>Size</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="10" class="note">No data yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// -------------------------------------------------------------- Team S tab

function renderTeamSRow(r) {
  const exec = r.execution_result;
  const badge = !exec
    ? statusBadge('dry run', 'muted')
    : (exec.executed ? statusBadge('executed', 'good') : statusBadge('skipped', 'muted'));
  return `
    <tr>
      <td>${fmtTime(r.run_at)}</td>
      <td>${esc(r.symbol)}</td>
      <td>${badge}</td>
      <td>${exec?.side ? esc(exec.side) : '—'}</td>
      <td>${exec?.total_qty ?? '—'}</td>
      <td>${exec?.reference_price ? fmtMoney(exec.reference_price) : '—'}</td>
      <td>${(exec?.child_orders || []).length}</td>
      <td class="wrap-cell">${exec && !exec.executed ? esc(exec.reason) : '—'}</td>
    </tr>`;
}

function renderTeamSTab(history) {
  const rows = recent(history).map(renderTeamSRow).join('');
  return `
    <div class="panel">
      <h2>Execution</h2>
      <p class="note">TWAP-sliced, whole-share orders; only acts on a Team-A-approved report -- see knowledge_base/team_s_execution.md.</p>
      <table>
        <thead><tr><th>Time</th><th>Symbol</th><th>Status</th><th>Side</th><th>Qty</th><th>Ref. Price</th><th>Child Orders</th><th>Skip Reason</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="note">No data yet.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

// ------------------------------------------------------------------ Router

const TAB_RENDERERS = {
  main: renderMainTab,
  teamc: renderTeamCTab,
  teamb: renderTeamBTab,
  teama: renderTeamATab,
  teams: renderTeamSTab,
};

function renderActiveTab() {
  if (!historyData.length) {
    renderEmpty('No runs logged yet.');
    return;
  }
  const renderer = TAB_RENDERERS[activeTab] || renderMainTab;
  document.getElementById('content').innerHTML = renderer(historyData);
  if (activeTab === 'main') wireEquityHover();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderActiveTab();
});

async function load() {
  try {
    const res = await fetch(HISTORY_URL + '?_=' + Date.now());
    if (!res.ok) {
      renderEmpty('No run history yet (logs/history.json not found).');
      return;
    }
    historyData = await res.json();
    renderActiveTab();
    document.getElementById('footer').textContent = 'Last refreshed ' + new Date().toLocaleTimeString();
  } catch (e) {
    renderEmpty('Could not load run history: ' + e.message);
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
