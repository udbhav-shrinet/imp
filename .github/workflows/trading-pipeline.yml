name: Trading Pipeline

on:
  schedule:
    # Every 4 hours, weekdays only.
    - cron: "0 */4 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated ticker symbols to scan (blank = main.py's ~75-symbol default watchlist)"
        required: false
        default: ""
      max_position_usd:
        description: "Hard dollar ceiling for a single position, regardless of equity"
        required: false
        default: "20"
      execute:
        description: "Actually submit the paper trade via Alpaca"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK VADER lexicon
        run: python -m nltk.downloader vader_lexicon

      - name: Run pipeline
        env:
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: trading-system-sentiment-bot/1.0
        run: |
          ARGS=(--max-position-usd "${{ github.event.inputs.max_position_usd || '20' }}")
          # Blank (scheduled runs, or a manual run left at the default) lets
          # main.py's own ~75-symbol DEFAULT_WATCHLIST apply instead of
          # duplicating that list here.
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            ARGS+=(--symbols "${{ github.event.inputs.symbols }}")
          fi
          # Scheduled runs (no workflow_dispatch inputs) execute by default;
          # a manual run can opt out with execute=false.
          if [ "${{ github.event.inputs.execute }}" != "false" ]; then
            ARGS+=(--execute)
          fi
          python main.py "${ARGS[@]}"

      - name: Commit updated trade history log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f logs/history.json ]; then
            git add logs/history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update trade history log [skip ci]"
              git push
            fi
          else
            echo "logs/history.json not written this run (pipeline likely failed before logging) -- nothing to commit."
          fi
