name: Trading Pipeline

on:
  schedule:
    # Every 4 hours, weekdays only.
    - cron: "0 */4 * * 1-5"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker symbol to analyze"
        required: false
        default: "AAPL"
      capital:
        description: "Capital allocated to this thesis (USD)"
        required: false
        default: "10000"
      execute:
        description: "Actually submit the paper trade via Alpaca"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NLTK VADER lexicon
        run: python -m nltk.downloader vader_lexicon

      - name: Run pipeline
        env:
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: trading-system-sentiment-bot/1.0
        run: |
          ARGS=(--symbol "${{ github.event.inputs.symbol || 'AAPL' }}" --capital "${{ github.event.inputs.capital || '10000' }}")
          # Scheduled runs (no workflow_dispatch inputs) execute by default;
          # a manual run can opt out with execute=false.
          if [ "${{ github.event.inputs.execute }}" != "false" ]; then
            ARGS+=(--execute)
          fi
          python main.py "${ARGS[@]}"

      - name: Commit updated trade history log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f logs/history.json ]; then
            git add logs/history.json
            if ! git diff --cached --quiet; then
              git commit -m "Update trade history log [skip ci]"
              git push
            fi
          else
            echo "logs/history.json not written this run (pipeline likely failed before logging) -- nothing to commit."
          fi
